worker_processes auto;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    lua_package_path "/usr/local/openresty/nginx/lua/?.lua;;";
    lua_shared_dict litewaf_rate_limit 10m;
    lua_shared_dict litewaf_dynamic_ban 10m;
    lua_shared_dict litewaf_dynamic_protection 10m;
    lua_shared_dict litewaf_metrics 10m;

    resolver 127.0.0.11 ipv6=off valid=10s;

    init_by_lua_block {
        litewaf = require "litewaf"
    }

    server {
        listen 8080;

        location = /healthz {
            default_type application/json;
            return 200 '{"status":"ok"}';
        }

        location = /metrics {
            content_by_lua_block {
                litewaf.metrics()
            }
        }

        location / {
            set $litewaf_upstream "";
            set $litewaf_request_id "";

            access_by_lua_block {
                litewaf.access()
            }

            header_filter_by_lua_block {
                litewaf.header_filter()
            }

            body_filter_by_lua_block {
                litewaf.body_filter()
            }

            log_by_lua_block {
                litewaf.log()
            }

            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Request-ID $litewaf_request_id;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_pass $litewaf_upstream;
        }
    }
}
